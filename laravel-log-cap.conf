[program:laravel-log-cap]
command=/bin/bash /usr/local/sbin/laravel-log-cap.sh
user=root
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/laravel-log-cap.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2