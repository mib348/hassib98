query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          title
          product {
            title
            productType
          }
        }
      }
      cost {
        amountPerQuantity {
          amount
        }
      }
      # CRITICAL: Query for yesterday items identification
      # Items are marked with yesterday_item="Y" attribute when added to cart from yesterday's inventory
      yesterdayItemAttribute: attribute(key: "yesterday_item") {
        value
      }
      # CRITICAL: Query immediate_inventory to exclude PREORDER lines from the discount.
      # immediate_inventory="Y" => immediate/yesterday item (eligible)
      # immediate_inventory="N" => preorder / future pickup (must NEVER get the yesterday 50%)
      # A preorder can never be a day-old "yesterday" item, so preorder lines are filtered out.
      immediateInventoryAttribute: attribute(key: "immediate_inventory") {
        value
      }
    }
    buyerIdentity {
      customer {
        id
        email
        loyaltyStatus: metafield(namespace: "loyalty", key: "status") {
          value
        }
        loyaltyFreeItems: metafield(namespace: "loyalty", key: "free_items") {
          value
        }
        customLoyaltyStatus: metafield(namespace: "custom", key: "loyalty_status") {
          value
        }
        customLoyaltyFreeItems: metafield(namespace: "custom", key: "loyalty_free_items") {
          value
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
