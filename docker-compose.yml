services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # Internal/plain MQTT stays private to the Ubuntu host
      - "8883:8883"   # Public TLS MQTT endpoint for mqtts://mqtt.sushi.catering
      - "127.0.0.1:9001:9001"   # Local-only WebSocket MQTT for troubleshooting
      - "127.0.0.1:9002:9002"   # Local-only Secure WebSocket MQTT for troubleshooting
    environment:
      MQTT_USER: ${MQTT_USER:-mqtt_12342026}
      MQTT_PASS: ${MQTT_PASSWORD:-mqtt_12342026}
      MQTT_TLS_CERT_FILE: /tls/fullchain.pem
      MQTT_TLS_KEY_FILE: /tls/privkey.pem
      MQTT_RUNTIME_DIR: /mosquitto/runtime
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/config/conf.d:/mosquitto/config/conf.d:ro
      - ./docker/mosquitto/config/bin:/mosquitto/config/bin:ro
      - ./docker/mosquitto/runtime:/mosquitto/runtime
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ${MQTT_TLS_CERT_DIR:-/www/server/panel/vhost/cert/mqtt.sushi.catering}:/tls:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint:
      - /bin/sh
      - /mosquitto/config/bin/bootstrap.sh
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mqtt-web-client:
    build:
      context: .
      dockerfile: docker/nodered/Dockerfile
    image: laravelshopifypartnerapp/mqtt-web-client:1.0
    container_name: mqtt-web-client
    restart: unless-stopped
    user: "0:0"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_BROKER_USERNAME: ${MQTT_USER:-mqtt_12342026}
      MQTT_BROKER_PASSWORD: ${MQTT_PASSWORD:-mqtt_12342026}
      MQTT_CERT_DIR: ${MQTT_TLS_CERT_DIR:-/www/server/panel/vhost/cert/mqtt.sushi.catering}
      AAPANEL_RENEW_COMMAND: ${AAPANEL_RENEW_COMMAND:-/www/server/panel/pyenv/bin/python -u /www/server/panel/class/acme_v2.py --renew=1}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-mqtt_12342026-node-red}
      NODE_RED_HTTP_USER: ${NODE_RED_HTTP_USER:-}
      NODE_RED_HTTP_PASSWORD: ${NODE_RED_HTTP_PASSWORD:-}
      NODE_RED_ENABLE_EDITOR: ${NODE_RED_ENABLE_EDITOR:-false}
    ports:
      - "127.0.0.1:${MQTT_DASHBOARD_LOCAL_PORT:-1885}:1880"   # Local dashboard target for mqtt.sushi.catering:8885
    volumes:
      - ./docker/nodered/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /www/server/panel:/www/server/panel
      - ${MQTT_TLS_CERT_DIR:-/www/server/panel/vhost/cert/mqtt.sushi.catering}:/tls:ro
      - mosquitto_log:/mosquitto-logs:ro   # Shared read-only access to Mosquitto log for connection tracking

volumes:
  mosquitto_data:
  mosquitto_log:
