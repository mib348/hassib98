# Authentication is split by listener:
# - 1883 is only for the local host / Docker network, so Node-RED and Laravel
#   can monitor/publish without getting blocked by a fragile seeded password.
# - 8883/9001/9002 stay protected by the password file. Docker binds them to
#   localhost targets, and public access is handled by the mqtt.sushi.catering
#   proxy layer.
per_listener_settings true
