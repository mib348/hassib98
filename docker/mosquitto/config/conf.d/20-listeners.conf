# Internal listener for Laravel on the same host or Docker network.
listener 1883
protocol mqtt
# This listener is intentionally anonymous because it is bound to localhost on
# the host machine and used by the internal Node-RED monitor container.
allow_anonymous true

# External TLS listener for Raspberry Pis and remote tools.
listener 8883
protocol mqtt
certfile /mosquitto/runtime/certs/server.crt
keyfile /mosquitto/runtime/certs/server.key
tls_version tlsv1.2
# External listeners must always authenticate so remote devices cannot connect
# just because they know the port number.
allow_anonymous false
password_file /mosquitto/runtime/passwd

# Optional browser-oriented listeners. Keep them enabled for troubleshooting,
# but the main monitoring UI is Node-RED on port 8884.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/runtime/passwd

listener 9002
protocol websockets
certfile /mosquitto/runtime/certs/server.crt
keyfile /mosquitto/runtime/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/runtime/passwd
